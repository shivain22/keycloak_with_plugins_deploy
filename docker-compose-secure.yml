# ===================================================================
# Secure Docker Compose Configuration
# 
# This configuration binds all services to localhost (127.0.0.1) only,
# making them accessible only via SSH tunnel or through Nginx reverse proxy.
# 
# Services are NOT exposed to the public internet directly.
# Use Nginx with SSL certificates for secure external access.
# ===================================================================

services:
  # ===================================================================
  # Infrastructure Services (Start First)
  # ===================================================================
  
  db:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-17}
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    # Bind to localhost only - accessible via SSH tunnel or Nginx
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  rms-postgresql:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-17}
    container_name: rms-postgresql
    environment:
      POSTGRES_DB: ${RMS_DB_NAME:-rms_gateway}
      POSTGRES_USER: ${RMS_DB_USERNAME:-rms}
      POSTGRES_PASSWORD: ${RMS_DB_PASSWORD:-rms}
    # Bind to localhost only - accessible via SSH tunnel
    ports:
      - "127.0.0.1:${RMS_POSTGRES_PORT:-5435}:5432"
    volumes:
      - rms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - ./docker/postgres/01-init-gateway-db.sh:/docker-entrypoint-initdb.d/02-init-gateway-db.sh:ro
      - ./docker/postgres/02-init-service-db.sh:/docker-entrypoint-initdb.d/03-init-service-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rms-zookeeper
    # Bind to localhost only - accessible via SSH tunnel
    ports:
      - "127.0.0.1:${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status 2>&1 | grep -q 'Mode:' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  consul:
    image: consul:1.15.4
    container_name: rms-consul
    # Bind to localhost only - accessible via SSH tunnel or Nginx
    ports:
      - "127.0.0.1:${CONSUL_PORT:-8500}:8500"
      - "127.0.0.1:8300:8300"
      - "127.0.0.1:8600:8600"
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8500/v1/status/leader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rms-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    # Bind to localhost only - accessible via SSH tunnel or Nginx
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rms-kafka
    # Bind to localhost only - accessible via SSH tunnel
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9295}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    container_name: rms-consul-config-loader
    volumes:
      - ${CONSUL_CONFIG_PATH:-./consul-config}:/config
    environment:
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak}:${KEYCLOAK_VERSION:-latest}
    container_name: keycloak
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./providers:/opt/keycloak/providers
      - ./realm-import:/opt/keycloak/data/import
      - ./docker/keycloak-entrypoint.sh:/opt/keycloak-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak-entrypoint.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_DISABLE_DEBUG: ${KEYCLOAK_DISABLE_DEBUG:-}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-}
      KC_PROXY: ${KC_PROXY:-edge}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      MSG91_URL: ${MSG91_URL:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
    # Bind to localhost only - accessible via Nginx with SSL
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-9292}:8080"
    command:
      - start-dev
      - --http-port=8080
      - --hostname-strict=false
      - --proxy-headers=${KC_PROXY_HEADERS:-xforwarded}
      - --import-realm
      - --spi-phone-default-service=${SMS_PROVIDER:-msg91}
      - --spi-phone-default-token-expires-in=${SMS_TOKEN_EXPIRES:-60}
      - --spi-phone-default-source-hour-maximum=${SMS_SOURCE_HOUR_MAX:-10}
      - --spi-phone-default-target-hour-maximum=${SMS_TARGET_HOUR_MAX:-3}
      - --spi-phone-default-ujwal-duplicate-phone=${DUPLICATE_PHONE:-false}
      - --spi-phone-default-ujwal-default-number-regex=${PHONE_REGEX:-^\\+?\\d+$}
      - --spi-phone-default-ujwal-valid-phone=${VALID_PHONE:-true}
      - --spi-phone-default-ujwal-canonicalize-phone-numbers=${CANONICALIZE_PHONE:-E164}
      - --spi-phone-default-ujwal-phone-default-region=${PHONE_DEFAULT_REGION:-IN}
      - --spi-phone-default-ujwal-compatible=${PHONE_COMPATIBLE:-false}
      - --spi-phone-default-ujwal-otp-expires=${OTP_EXPIRES:-3600}
      - --spi-message-sender-service.msg91.url=${MSG91_URL:-https://control.msg91.com/api/v5/flow}
      - --spi-message-sender-service.msg91.authKey=${MSG91_AUTH_KEY:-CHANGE_ME}
      - --spi-message-sender-service.msg91.templateId=${MSG91_TEMPLATE_ID:-CHANGE_ME}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  rms_postgres_data:


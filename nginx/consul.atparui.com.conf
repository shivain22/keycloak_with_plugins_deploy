# ===================================================================
# Nginx Configuration for Consul UI with OAuth2 Proxy Authentication
# 
# This configuration secures the Consul UI (/ui paths) using oauth2-proxy
# while keeping the Consul API (/v1 paths) directly accessible for internal services.
# ===================================================================

server {
    server_name consul.atparui.com;

    # Redirect root path to /ui/
    location = / {
        return 301 https://$host/ui/;
    }

    # Consul UI - Protected by OAuth2 Proxy
    # Routes /ui paths through oauth2-proxy for authentication
    location ~ ^/ui {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # OAuth2 Proxy callback endpoint
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Consul API - Direct access (unprotected for internal services)
    # This allows internal services to continue accessing Consul API without authentication
    location /v1/ {
        proxy_pass http://192.168.0.102:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/consul.atparui.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/consul.atparui.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP to HTTPS redirect
server {
    if ($host = consul.atparui.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name consul.atparui.com;
    return 404; # managed by Certbot
}


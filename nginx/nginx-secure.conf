# ===================================================================
# Nginx Configuration for Secure Service Access
# 
# This configuration provides SSL termination for all services
# running on localhost behind Nginx.
# 
# Services are accessible via HTTPS subdomains with SSL certificates.
# ===================================================================

# Upstream definitions for services
upstream keycloak_backend {
    server 127.0.0.1:9292;
}

upstream consul_backend {
    server 127.0.0.1:8500;
}

upstream elasticsearch_backend {
    server 127.0.0.1:9200;
}

# Keycloak - Identity Provider
server {
    listen 443 ssl http2;
    server_name keycloak.your-domain.com;

    ssl_certificate /etc/nginx/ssl/keycloak.your-domain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/keycloak.your-domain.com.key;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location / {
        proxy_pass http://keycloak_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# Consul - Service Discovery (Optional - usually internal only)
server {
    listen 443 ssl http2;
    server_name consul.your-domain.com;

    ssl_certificate /etc/nginx/ssl/consul.your-domain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/consul.your-domain.com.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Restrict access (optional - remove if you want public access)
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass http://consul_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Elasticsearch - Search Engine (Optional - usually internal only)
server {
    listen 443 ssl http2;
    server_name elasticsearch.your-domain.com;

    ssl_certificate /etc/nginx/ssl/elasticsearch.your-domain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/elasticsearch.your-domain.com.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Restrict access (recommended - Elasticsearch should not be public)
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass http://elasticsearch_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Elasticsearch specific settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name keycloak.your-domain.com consul.your-domain.com elasticsearch.your-domain.com;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

